<style>

  }
}

}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {

}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 620px; margin: 0 auto; }
a { color: var(--harbor); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--harbor); outline-offset: 2px; }

header.top { padding-block: 22px 14px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--muted); font-weight: 500; }
h1 { font-size: 28px; line-height: 1.2; margin: 4px 0 6px; text-wrap: balance; letter-spacing: -.01em; }

nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);

section.view { padding-top: 18px; }
.day-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }

ol.timeline { list-style: none; margin: 0; padding: 0; position: relative; }

.flight .pt:last-child { text-align: right; }
.flight .arrow { color: var(--muted); font-size: 13px; text-align: center; }
dl.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 14px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; min-width: 0; }

.places { display: grid; gap: 8px; }
.place { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.place div { min-width: 0; }
.place b { font-size: 14px; display: block; }
.place span { font-size: 13px; color: var(--muted); }
.place .zh { font-family: var(--font-zh); }
.place .btn { flex-shrink: 0; }

.check label { display: flex; gap: 10px; align-items: center; padding: 6px 0; font-size: 14px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--harbor); }

.phrases { display: grid; gap: 8px; }
.phrase { text-align: left; width: 100%; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
.phrase b { font-family: var(--font-zh); font-size: 17px; display: block; }
.phrase span { font-size: 13px; color: var(--muted); }

#card { position: fixed; inset: 0; z-index: 20; background: var(--surface); display: flex; flex-direction: column;

#card .lead { font-family: var(--font-zh); font-size: 20px; color: var(--muted); }
#card .big { font-family: var(--font-zh); font-weight: 700; font-size: clamp(36px, 11vw, 64px); line-height: 1.2; margin: 14px 0; word-break: break-all; }
#card .addr { font-family: var(--font-zh); font-size: 20px; }

#card .close { margin-top: auto; align-self: stretch; padding: 14px; border-radius: 12px; border: 0; background: var(--harbor); color: var(--surface); font-size: 16px; font-weight: 700; cursor: pointer; }

footer { margin-top: 32px; font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

const mapUrl = q => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function taipeiNow() {
  const parts = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Taipei", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(new Date());
  const g = k => parts.find(p => p.type === k).value;
  return { date: `${g("year")}-${g("month")}-${g("day")}`, time: `${g("hour")}:${g("minute")}` };
}

function renderDay(d, now) {
  const isToday = now.date === d.date;
  let nowIdx = -1;
  if (isToday) d.stops.forEach((s, i) => { if (s.t <= now.time) nowIdx = i; });
  const stops = d.stops.map((s, i) => {
    const q = s.query || (s.zh && !s.zh.startsWith("長榮") && !s.zh.startsWith("哈佛") && !s.zh.includes("→") ? s.zh + " 高雄" : null);
    const taxiBtn = s.taxi ? `<button class="btn taxi" type="button" data-zh="${esc(s.taxi.zh)}" data-addr="${esc(s.taxi.addr || "")}" data-ko="${esc(s.taxi.ko)}">택시 카드</button>` : "";
    const mapBtn = q && s.zh !== HOTEL.zh ? `<a class="btn" href="${mapUrl(q)}" target="_blank" rel="noopener">지도</a>` : "";
    const acts = taxiBtn || mapBtn ? `<div class="actions">${mapBtn}${taxiBtn}</div>` : "";
    return `<li class="stop${s.sun ? " sun" : ""}${s.opt ? " opt" : ""}${i === nowIdx ? " now" : ""}">
      <div class="t">${s.t}</div>
      <div class="body">
        <h3>${s.opt ? '<span class="opt-tag">선택</span>' : ""}${esc(s.ko)}${i === nowIdx ? '<span class="now-tag">지금</span>' : ""}</h3>
        ${s.zh ? `<div class="zh">${esc(s.zh)}</div>` : ""}
        ${s.memo ? `<p>${esc(s.memo)}</p>` : ""}
        ${acts}
      </div>
    </li>`;
  }).join("");
  return `<section class="view" id="v-${d.id}" hidden>
    <div class="day-head"><h2>${esc(d.title)}</h2><span class="date">${d.label}</span></div>
    <p class="day-sub">${esc(d.sub)}</p>
    <ol class="timeline">${stops}</ol>
    <div class="panel"><h3>${esc(d.notes.h)}</h3><ul>${d.notes.items.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
  </section>`;
}

function loadChecks() { try { return JSON.parse(localStorage.getItem("khh-check") || "[]"); } catch (e) { return []; } }
function saveChecks(v) { try { localStorage.setItem("khh-check", JSON.stringify(v)); } catch (e) {} }

    <a class="btn" href="${mapUrl(p.q || p.zh + " 高雄")}" target="_blank" rel="noopener">지도</a></div>`).join("")}</div>`).join("");

    <div class="panel" style="margin-top:0">

        <dt>중국어</dt><dd style="font-family:var(--font-zh)">${HOTEL.zh}</dd>
        <dt>주소</dt><dd style="font-family:var(--font-zh)">${HOTEL.addr}</dd>
        <dt>숙박</dt><dd>11.13 금 – 11.15 일 · 2박</dd>
      </dl>
      <div class="actions">
        <button class="btn taxi" type="button" data-zh="${HOTEL.zh}" data-addr="${HOTEL.addr}" data-ko="${HOTEL.ko}">택시 카드</button>
        <a class="btn" href="${mapUrl("Grand Hi-Lai Hotel Kaohsiung")}" target="_blank" rel="noopener">지도</a>

    </div>

    <h2>저장해 둔 장소</h2>
    <a class="btn" href="https://maps.app.goo.gl/TVhCjtMG1nF7SVXy8" target="_blank" rel="noopener">구글맵 '가오슝 2026' 목록 열기</a>
    ${places}

    <h2>바로 보여주는 중국어</h2>
    <div class="phrases">${PHRASES.map(p => `<button class="phrase" type="button" data-zh="${esc(p.zh)}" data-addr="" data-ko="${esc(p.ko)}" data-plain="1"><b>${esc(p.zh)}</b><span>${esc(p.ko)}</span></button>`).join("")}</div>

    <h2>챙길 것</h2>
    <div class="panel check" style="margin-top:0">${CHECK.map((c, i) => `<label for="chk-${i}"><input type="checkbox" id="chk-${i}" data-i="${i}" ${checked.includes(i) ? "checked" : ""}>${esc(c)}</label>`).join("")}</div>

    <h2>알아두면 좋은 것</h2>
    <div class="panel" style="margin-top:0">
      <dl class="kv">
        <dt>시차</dt><dd>한국보다 1시간 늦어요</dd>
        <dt>날씨</dt><dd>11월 20~28°C, 맑고 건조한 편</dd>
        <dt>전압</dt><dd>110V, 11자 콘센트라 어댑터 필요</dd>
        <dt>교통</dt><dd>MRT·페리·버스 모두 이지카드(悠遊卡)</dd>

      </dl>
    </div>
  </section>`;
}

const views = document.getElementById("views");
const now = taipeiNow();
views.innerHTML = DAYS.map(d => renderDay(d, now)).join("") + renderInfo();

const status = document.getElementById("status");
const today = DAYS.findIndex(d => d.date === now.date);
if (today >= 0) status.textContent = `오늘은 여행 ${today + 1}일차`;
else if (now.date < DAYS[0].date) {
  const diff = Math.round((new Date(DAYS[0].date) - new Date(now.date)) / 86400000);
  status.textContent = `출발까지 D-${diff}`;
}

const VALID = ["day1", "day2", "day3", "info"];
function show() {
  let id = location.hash.slice(1);
  if (!VALID.includes(id)) id = today >= 0 ? DAYS[today].id : "day1";
  VALID.forEach(v => { document.getElementById("v-" + v).hidden = v !== id; });
  document.querySelectorAll("nav.tabs a").forEach(a => {
    if (a.getAttribute("href") === "#" + id) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
}
window.addEventListener("hashchange", () => { show(); window.scrollTo(0, 0); });
show();

const card = document.getElementById("card");
let lastFocus = null;
document.addEventListener("click", e => {
  const b = e.target.closest("[data-zh]");
  if (!b) return;
  lastFocus = b;
  const plain = b.dataset.plain === "1";
  card.querySelector(".lead").hidden = plain;
  document.getElementById("card-big").textContent = b.dataset.zh;
  document.getElementById("card-addr").textContent = b.dataset.addr;
  document.getElementById("card-ko").textContent = b.dataset.ko;
  card.hidden = false;
  document.getElementById("card-close").focus();
});
function closeCard() { card.hidden = true; if (lastFocus) lastFocus.focus(); }
document.getElementById("card-close").addEventListener("click", closeCard);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !card.hidden) closeCard(); });

document.addEventListener("change", e => {
  if (!e.target.matches(".check input")) return;
  const v = [...document.querySelectorAll(".check input:checked")].map(x => +x.dataset.i);
  saveChecks(v);
});
